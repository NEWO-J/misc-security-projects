<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Auth Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>


<div class="container">
    <h1 class="title">Login Portal</h1>
    <form class="auth" id="auth">
        <input type="text" name="username">
        <input type="text" name="password">
    </form>

    <button type="submit" form="auth" id="login-btn">
        Login
    </button>
    <h3>No account?</h3>
    <h3 href="/register">Register</h3>
</div>

</body>
</html>
