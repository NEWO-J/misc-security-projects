<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Auth Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>


<div class="container">
    <h1 class="title">Registration Portal</h1>
    <h3 class="error" id="errormsg"></h3>
    <form class="register" id="register">
        <input type="text" name="Username", placeholder="username">
        <input type="text" name="Password", placeholder="password">
    </form>

    <button type="submit" form="register" id="reg-btn">
        Register
    </button>
</div>

</body>
</html>
